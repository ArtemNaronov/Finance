[package]
name = "finance"
version = "1.1.0"
description = "Finance — personal finance app"
authors = ["Finance"]
edition = "2021"

[lib]
name = "finance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.11", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Workaround: time 0.3.48 breaks tauri-utils blanket From impls
# https://github.com/time-rs/time/issues/783
time = "=0.3.47"
