[package]
name = "finance"
version = "1.1.0"
description = "Finance — personal finance app"
authors = ["Finance"]
edition = "2021"

[lib]
name = "finance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
